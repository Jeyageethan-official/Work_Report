<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error | WorkReport</title>
  <meta name="description" content="WorkReport error page." />
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://workreport.online/error" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/frontend/auth/assets/css/legal.css?v=20260315c" />
  <style>
    .error-shell {
      min-height: calc(100vh - 56px);
      display: grid;
      align-items: center;
    }

    .error-panel {
      position: relative;
      overflow: hidden;
      display: grid;
      gap: 24px;
      padding: 34px;
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(236, 244, 255, 0.92));
      border: 1px solid rgba(148, 179, 228, 0.34);
      box-shadow: 0 34px 70px rgba(19, 50, 118, 0.16);
    }

    .error-panel::before {
      content: "";
      position: absolute;
      inset: auto -80px -100px auto;
      width: 300px;
      height: 300px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.18), transparent 70%);
      pointer-events: none;
    }

    .error-layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(260px, 0.9fr);
      gap: 24px;
      align-items: center;
    }

    .error-copy {
      display: grid;
      gap: 16px;
    }

    .error-code {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      width: fit-content;
      padding: 0 14px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.1);
      border: 1px solid rgba(37, 99, 235, 0.16);
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .error-title {
      margin: 0;
      font-size: clamp(34px, 4.4vw, 54px);
      line-height: 1.02;
      letter-spacing: -0.05em;
      color: #0f172a;
    }

    .error-message {
      margin: 0;
      max-width: 640px;
      color: #5f6f8f;
      font-size: 18px;
      line-height: 1.7;
    }

    .error-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .error-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: -0.01em;
      border: 1px solid rgba(37, 99, 235, 0.14);
      box-shadow: 0 18px 34px rgba(37, 99, 235, 0.14);
    }

    .error-btn.primary {
      color: #fff;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6 52%, #60a5fa);
    }

    .error-btn.secondary {
      color: #0f172a;
      background: rgba(255, 255, 255, 0.88);
    }

    .error-visual {
      position: relative;
      min-height: 280px;
      border-radius: 28px;
      overflow: hidden;
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 52%, #60a5fa 100%);
      box-shadow: 0 28px 58px rgba(18, 52, 134, 0.22);
    }

    .error-visual::before,
    .error-visual::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .error-visual::before {
      width: 320px;
      height: 320px;
      top: -190px;
      right: -90px;
    }

    .error-visual::after {
      width: 260px;
      height: 260px;
      bottom: -170px;
      left: -60px;
    }

    .error-visual-inner {
      position: absolute;
      inset: 28px;
      display: grid;
      gap: 16px;
      align-content: center;
      padding: 24px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
    }

    .error-visual-card {
      display: grid;
      gap: 10px;
      padding: 22px;
      border-radius: 20px;
      background: rgba(247, 251, 255, 0.95);
      box-shadow: 0 18px 40px rgba(18, 39, 96, 0.2);
    }

    .error-visual-label {
      color: #35528c;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .error-visual-heading {
      color: #0f172a;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .error-visual-lines {
      display: grid;
      gap: 8px;
    }

    .error-visual-lines span {
      display: block;
      height: 7px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.94), rgba(34, 211, 238, 0.88));
    }

    .error-visual-lines span:nth-child(1) { width: 82%; }
    .error-visual-lines span:nth-child(2) { width: 68%; }
    .error-visual-lines span:nth-child(3) { width: 76%; }

    @media (max-width: 920px) {
      .error-layout {
        grid-template-columns: 1fr;
      }

      .error-visual {
        min-height: 220px;
      }
    }

    @media (max-width: 680px) {
      .error-panel {
        padding: 24px;
        border-radius: 24px;
      }

      .error-title {
        font-size: 34px;
      }

      .error-message {
        font-size: 16px;
      }

      .error-actions {
        display: grid;
      }

      .error-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body class="page-legal">
  <main class="legal-shell error-shell">
    <header class="legal-topbar">
      <a class="legal-brand" href="/">
        <span class="legal-brand-mark">
          <img src="/icons/favicon.png?v=20260315j" alt="Work Report logo" />
        </span>
        <span class="legal-brand-copy">
          <span class="legal-brand-name">Work Report</span>
          <span class="legal-brand-note">Error page</span>
        </span>
      </a>
      <div class="legal-actions">
        <a class="legal-link" href="/privacy">Privacy Policy</a>
        <a class="legal-link primary" href="/">Back to Home</a>
      </div>
    </header>

    <section class="error-panel">
      <div class="error-layout">
        <div class="error-copy">
          <div id="errorCode" class="error-code">Error</div>
          <h1 id="errorTitle" class="error-title">Something did not complete as expected.</h1>
          <p id="errorMessage" class="error-message">
            Work Report could not finish this request. Retry once, or go back to the site and continue from a stable route.
          </p>
          <div class="error-actions">
            <a id="errorRetry" class="error-btn primary" href="/">Retry</a>
            <a id="errorHome" class="error-btn secondary" href="/">Back to Home</a>
          </div>
        </div>

        <div class="error-visual" aria-hidden="true">
          <div class="error-visual-inner">
            <div class="error-visual-card">
              <div class="error-visual-label">Request status</div>
              <div id="errorVisualHeading" class="error-visual-heading">Unavailable</div>
              <div class="error-visual-lines">
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code") || "Error";
      const title = params.get("title") || "Something did not complete as expected.";
      const message = params.get("message") || "Work Report could not finish this request. Retry once, or go back to the site and continue from a stable route.";
      const retry = params.get("retry") || "/";
      const home = params.get("home") || "/";
      const visual = params.get("visual") || "Unavailable";

      const errorCode = document.getElementById("errorCode");
      const errorTitle = document.getElementById("errorTitle");
      const errorMessage = document.getElementById("errorMessage");
      const errorRetry = document.getElementById("errorRetry");
      const errorHome = document.getElementById("errorHome");
      const errorVisualHeading = document.getElementById("errorVisualHeading");

      if (errorCode) errorCode.textContent = String(code);
      if (errorTitle) errorTitle.textContent = String(title);
      if (errorMessage) errorMessage.textContent = String(message);
      if (errorRetry) errorRetry.href = retry;
      if (errorHome) errorHome.href = home;
      if (errorVisualHeading) errorVisualHeading.textContent = String(visual);
      document.title = `${title} | Work Report`;
    })();
  </script>
</body>
</html>
