<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Completing sign in | WorkReport</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font: 500 16px system-ui, sans-serif; }
    main { text-align: center; padding: 24px; } .spinner { width: 32px; height: 32px; margin: 0 auto 18px; border: 3px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin .75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="/frontend/auth/assets/js/vendor/supabase-js.min.js"></script>
  <script src="/frontend/auth/assets/js/config.js"></script>
  <script src="/frontend/auth/assets/js/supabase-client.js"></script>
</head>
<body>
  <main><div class="spinner"></div><div id="message">Completing your sign in…</div></main>
  <script>
    (async () => {
      const message = document.getElementById('message');
      const params = new URLSearchParams(window.location.search);
      const requestedNext = params.get('next') || '/app';
      let destination = '/app';
      try {
        const candidate = new URL(requestedNext, window.location.origin);
        if (candidate.origin === window.location.origin && candidate.pathname.startsWith('/app')) destination = candidate.pathname + candidate.search;
      } catch (_) {}
      try {
        const session = await window.WRSupabase.consumeUrlSession();
        if (!session) throw new Error('No sign-in session was returned.');
        window.location.replace(destination);
      } catch (error) {
        message.textContent = 'Sign in could not be completed. Returning to sign in…';
        window.setTimeout(() => window.location.replace('/signin?reason=oauth_callback_failed'), 1400);
      }
    })();
  </script>
</body>
</html>
