<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>Forgot Password | Work Report</title>
  <link rel="stylesheet" href="/frontend/auth/assets/css/auth.css?v=20260520supportpanel" />
</head>
<body class="page-auth auth-premium auth-forgot">
  <script>
    (function () {
      const host = String(window.location.hostname || "").toLowerCase();
      const protocol = String(window.location.protocol || "").toLowerCase();
      const ua = String(navigator.userAgent || "");
      const params = new URLSearchParams(window.location.search);
      const nextHint = String(params.get("next") || "");
      const nativeHint = params.get("native") === "1" || /^workreport:\/\//i.test(nextHint);
      const isNativeRuntime = protocol === "app:" || protocol === "file:" || host === "appassets.androidplatform.net" || /WorkReportiOSApp/i.test(ua) || nativeHint;
      const isMobileViewport = window.matchMedia("(max-width: 768px)").matches;
      if (isNativeRuntime && (isMobileViewport || nativeHint)) {
        document.body.classList.add("native-mobile-auth");
      }
    })();
  </script>
  <main class="auth-shell">
    <section class="auth-panel">
      <button type="button" class="auth-back-btn" data-auth-back-btn="true" aria-label="Go back">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 18L9 12L15 6"/></svg>
      </button>
      <div class="mobile-hero" aria-hidden="true">
        <div class="mobile-hero-top"></div>
        <div class="mobile-hero-logo"><img src="/icons/logo.png?v=20260312u" alt="Work Report logo" /></div>
      </div>

      <div class="auth-head">
        <h1>Reset password</h1>
        <p>Enter your email to receive a reset link.</p>
      </div>

      <form id="forgot-form" class="auth-form" novalidate>
        <div class="field">
          <label for="forgot-email">Email</label>
          <div class="input-icon-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input id="forgot-email" name="email" type="email" autocomplete="email" required />
          </div>
        </div>

        <div id="form-status" class="status-box" role="status" aria-live="polite"></div>
        <button id="forgot-submit" class="btn btn-primary" type="submit">Send Reset Link</button>
      </form>

      <p class="form-footer"><a class="link" href="/signin">Back to sign in</a></p>
    </section>

    <section class="brand-panel" aria-hidden="true">
      <div class="premium-brand-top">
        <div class="premium-brand-id">
          <div class="brand-logo"><img src="/icons/logo.png?v=20260312u" alt="Work Report logo" /></div>
          <span class="premium-brand-name">Work Report</span>
        </div>
      </div>
      <h2 class="brand-title">Secure recovery flow.</h2>
      <p class="brand-copy">Use your registered email and set a new password safely.</p>

      <div class="premium-visual">
        <svg viewBox="0 0 620 360" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="22" y="24" width="576" height="312" rx="20" fill="rgba(219,234,254,.38)" />
          <path class="vector-wave" d="M34 280C114 220 196 298 286 250C380 200 470 284 580 238" stroke="#dbeafe" stroke-width="2.5" stroke-linecap="round"/>
          <circle class="vector-dots" cx="118" cy="98" r="3" fill="#e2e8f0"/>
          <circle class="vector-dots" cx="470" cy="120" r="3" fill="#e2e8f0"/>
        </svg>
        <div class="visual-card-main">
          <div class="metric-chip">Recovery</div>
          <div class="metric-value">Active</div>
          <div class="visual-bars">
            <span style="--w:80%"></span>
            <span style="--w:69%"></span>
            <span style="--w:75%"></span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/frontend/auth/assets/js/vendor/supabase-js.min.js?v=20260312v"></script>
  <script src="/frontend/auth/assets/js/config.js?v=20260312w"></script>
  <script src="/frontend/auth/assets/js/supabase-client.js?v=20260330oauthstartupfix"></script>
  <script src="/frontend/auth/assets/js/api.js?v=20260330supportcenter1"></script>
  <script src="/frontend/auth/assets/js/ui.js?v=20260328f"></script>
  <script src="/frontend/auth/assets/js/support-center.js?v=20260520supportcenter"></script>
  <script src="/frontend/auth/assets/js/forgot.js?v=20260312w"></script>
</body>
</html>
