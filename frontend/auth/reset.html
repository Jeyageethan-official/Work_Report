<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>Reset Password | Work Report</title>
  <link rel="stylesheet" href="/frontend/auth/assets/css/auth.css?v=20260520supportpanel" />
</head>
<body class="page-auth auth-premium auth-reset">
  <script>
    (function () {
      const host = String(window.location.hostname || "").toLowerCase();
      const protocol = String(window.location.protocol || "").toLowerCase();
      const ua = String(navigator.userAgent || "");
      const params = new URLSearchParams(window.location.search);
      const nextHint = String(params.get("next") || "");
      const nativeHint = params.get("native") === "1" || /^workreport:\/\//i.test(nextHint);
      const isNativeRuntime = protocol === "app:" || protocol === "file:" || host === "appassets.androidplatform.net" || /WorkReportiOSApp/i.test(ua) || nativeHint;
      const isMobileViewport = window.matchMedia("(max-width: 768px)").matches;
      if (isNativeRuntime && (isMobileViewport || nativeHint)) {
        document.body.classList.add("native-mobile-auth");
      }
    })();
  </script>
  <main class="auth-shell">
    <section class="auth-panel">
      <button type="button" class="auth-back-btn" data-auth-back-btn="true" aria-label="Go back">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 18L9 12L15 6"/></svg>
      </button>
      <div class="mobile-hero" aria-hidden="true">
        <div class="mobile-hero-top"></div>
        <div class="mobile-hero-logo"><img src="/icons/logo.png?v=20260312u" alt="Work Report logo" /></div>
      </div>

      <div class="auth-head">
        <h1>Reset password</h1>
        <p>Enter your new password and confirm.</p>
        <p id="owner-reset-hint" class="owner-reset-hint" hidden>This owner-only reset will take you back to the owner console sign-in page.</p>
      </div>

      <form id="reset-form" class="auth-form" novalidate>
        <div class="field">
          <label for="reset-password">New password</label>
          <div class="input-wrap input-icon-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="reset-password" name="password" type="password" autocomplete="new-password" required />
            <button class="eye-toggle" id="toggle-reset-password" type="button" aria-label="Show password">Show</button>
          </div>
        </div>

        <div class="field">
          <label for="reset-confirm">Confirm new password</label>
          <div class="input-wrap input-icon-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
            </span>
            <input id="reset-confirm" name="confirmPassword" type="password" autocomplete="new-password" required />
            <button class="eye-toggle" id="toggle-reset-confirm" type="button" aria-label="Show password">Show</button>
          </div>
        </div>

        <div id="form-status" class="status-box" role="status" aria-live="polite"></div>
        <button id="reset-submit" class="btn btn-primary" type="submit">Reset Password</button>
      </form>
    </section>

    <section class="brand-panel" aria-hidden="true">
      <div class="premium-brand-top">
        <div class="premium-brand-id">
          <div class="brand-logo"><img src="/icons/logo.png?v=20260312u" alt="Work Report logo" /></div>
          <span class="premium-brand-name">Work Report</span>
        </div>
      </div>
      <h2 class="brand-title">Set your new password safely.</h2>
      <p class="brand-copy">Strong password update with secure token validation.</p>

      <div class="premium-visual">
        <svg viewBox="0 0 620 360" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="22" y="24" width="576" height="312" rx="20" fill="rgba(219,234,254,.38)" />
          <path class="vector-wave" d="M34 280C114 220 196 298 286 250C380 200 470 284 580 238" stroke="#dbeafe" stroke-width="2.5" stroke-linecap="round"/>
          <circle class="vector-dots" cx="118" cy="98" r="3" fill="#e2e8f0"/>
          <circle class="vector-dots" cx="470" cy="120" r="3" fill="#e2e8f0"/>
        </svg>
        <div class="visual-card-main">
          <div class="metric-chip">Reset</div>
          <div class="metric-value">Secure</div>
          <div class="visual-bars">
            <span style="--w:84%"></span>
            <span style="--w:71%"></span>
            <span style="--w:77%"></span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/frontend/auth/assets/js/vendor/supabase-js.min.js?v=20260312v"></script>
  <script src="/frontend/auth/assets/js/config.js?v=20260312w"></script>
  <script src="/frontend/auth/assets/js/supabase-client.js?v=20260330oauthstartupfix"></script>
  <script src="/frontend/auth/assets/js/api.js?v=20260330supportcenter1"></script>
  <script src="/frontend/auth/assets/js/ui.js?v=20260329ownerreset1"></script>
  <script src="/frontend/auth/assets/js/support-center.js?v=20260520supportcenter"></script>
  <script src="/frontend/auth/assets/js/reset.js?v=20260329ownerreset1"></script>
</body>
</html>
